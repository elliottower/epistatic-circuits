[project]
name = "epistatic-circuits"
version = "0.1.0"
description = "Circuit Discovery Methods as Selective Pressures: Walsh-Hadamard Analysis of Interaction Structure"
requires-python = ">=3.11"
dependencies = [
    "torch==2.6.0",
    "numpy==1.26.4",
    "tqdm==4.67.1",
    "transformer-lens==2.17.0",
    "transformers==4.51.3",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    "matplotlib==3.9.4",
    "datasets==3.2.0",
    "einops==0.8.0",
    "pandas==2.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
